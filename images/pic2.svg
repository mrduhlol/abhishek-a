<svg xmlns="http://www.w3.org/2000/svg" width="800" height="950" viewBox="0 0 800 950">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#0f1f2b"/>
      <stop offset="60%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#07090c"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="950" fill="url(#bg)"/>
  <rect width="800" height="950" fill="url(#grid)"/>
  <!-- radar rings -->
  <g fill="none" stroke="rgba(0,229,255,0.35)" stroke-width="2">
    <circle cx="400" cy="430" r="110"/>
    <circle cx="400" cy="430" r="175" opacity="0.6"/>
    <circle cx="400" cy="430" r="240" opacity="0.35"/>
    <circle cx="400" cy="430" r="300" opacity="0.18"/>
  </g>
  <path d="M400 430 640 240 A300 300 0 0 0 400 130Z" fill="url(#sweep)"/>
  <line x1="400" y1="120" x2="400" y2="740" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <line x1="90" y1="430" x2="710" y2="430" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- blips -->
  <circle cx="520" cy="330" r="9" fill="#00e5ff"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="280" cy="520" r="7" fill="#4ade80"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="540" r="6" fill="#facc15"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <!-- shield -->
  <path d="M400 330l72 31v47c0 45-31 84-72 102-41-18-72-57-72-102v-47z" fill="#0b1622" stroke="#00e5ff" stroke-width="4"/>
  <path d="M372 432l20 20 38-42" fill="none" stroke="#4ade80" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="620" text-anchor="middle" font-family="monospace" font-size="26" fill="#00e5ff" letter-spacing="4">[ SCANNING… 0 THREATS ]</text>
  <text x="400" y="850" text-anchor="middle" font-family="monospace" font-size="26" letter-spacing="8" fill="rgba(255,255,255,0.4)">THE HUNT — 02</text>
</svg>
