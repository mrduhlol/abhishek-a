<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abhishek A — CSE Cyber Security</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #07090c;
    color: #f1f4f8;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* soft plain bg: one calm glow + faint grid */
  .glow {
    position: fixed; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,229,255,0.10), transparent 65%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: left .3s ease-out, top .3s ease-out;
  }
  .grid {
    position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(circle at 50% 45%, black, transparent 75%);
  }
  #stars { position: fixed; inset: 0; }

  header {
    position: relative; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    max-width: 900px; margin: 0 auto; padding: 28px 24px;
    font-size: 0.85rem; color: rgba(255,255,255,0.55);
  }
  header b { color: #fff; letter-spacing: 0.08em; }

  main {
    position: relative; z-index: 5;
    height: calc(100vh - 140px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 0 24px;
    animation: rise 1s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .eyebrow {
    font-size: 0.75rem; letter-spacing: 0.35em;
    color: rgba(255,255,255,0.5); text-transform: uppercase;
  }
  h1 {
    margin-top: 14px;
    font-size: clamp(2.8rem, 9vw, 5.5rem);
    font-weight: 800; letter-spacing: -0.03em; line-height: 1;
  }
  .rule { width: 48px; height: 2px; background: #00e5ff; border-radius: 2px; margin: 22px 0 16px; box-shadow: 0 0 14px rgba(0,229,255,0.8); }
  h2 {
    font-size: clamp(0.8rem, 2.6vw, 1rem);
    font-weight: 600; letter-spacing: 0.5em; text-indent: 0.5em;
    color: rgba(165,243,252,0.9);
  }
  p { margin-top: 16px; color: rgba(255,255,255,0.55); font-size: 0.95rem; }

  .row { display: flex; gap: 12px; margin-top: 30px; }
  a.btn {
    text-decoration: none; font-size: 0.85rem; font-weight: 600;
    padding: 11px 26px; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff; background: rgba(255,255,255,0.05);
    transition: all .2s;
  }
  a.btn.solid { background: #fff; color: #000; border-color: #fff; }
  a.btn:hover { transform: translateY(-2px); }
  a.btn.solid:hover { box-shadow: 0 8px 28px rgba(255,255,255,0.25); }
  a.btn:not(.solid):hover { border-color: rgba(0,229,255,0.6); box-shadow: 0 8px 28px rgba(0,229,255,0.15); }

  footer {
    position: relative; z-index: 5; text-align: center;
    color: rgba(255,255,255,0.3); font-size: 0.72rem; letter-spacing: 0.25em;
    padding-bottom: 26px; text-transform: uppercase;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="grid"></div>
<div class="glow" id="glow" style="left:50%;top:45%"></div>

<header><b>AA.</b><span>portfolio © 2026</span></header>

<main>
  <div class="eyebrow">Hello, I'm</div>
  <h1>ABHISHEK A</h1>
  <div class="rule"></div>
  <h2>CSE CYBER SECURITY</h2>
  <p>Learning to hack safely & build securely.</p>
  <div class="row">
    <a class="btn solid" href="#">GitHub</a>
    <a class="btn" href="#">Contact</a>
  </div>
</main>

<footer>stay curious • stay secure</footer>

<script>
  // tiny calm starfield
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let W, H, dots = [];
  function rs() { W = c.width = innerWidth; H = c.height = innerHeight; }
  addEventListener('resize', rs); rs();
  for (let i = 0; i < 70; i++) dots.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4+0.3, s: Math.random()*0.25+0.05 });
  addEventListener('mousemove', e => {
    const g = document.getElementById('glow');
    g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
  });
  (function loop() {
    x.clearRect(0, 0, W, H);
    for (const d of dots) {
      d.y -= d.s; if (d.y < 0) { d.y = H; d.x = Math.random()*W; }
      x.beginPath(); x.arc(d.x, d.y, d.r, 0, 7);
      x.fillStyle = 'rgba(255,255,255,0.45)'; x.fill();
    }
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
