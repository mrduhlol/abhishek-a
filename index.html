<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello — abhishek-a</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    cursor: crosshair;
  }

  /* --- Crazy animated base gradient --- */
  .bg-base {
    position: fixed; inset: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, #ff0080, #7928ca, #0070f3, #00ffa3, #ffea00, #ff0080);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    opacity: 0.35;
    filter: saturate(1.6);
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; transform: rotate(0deg) scale(1); }
    50% { background-position: 100% 50%; transform: rotate(180deg) scale(1.2); }
    100% { background-position: 0% 50%; transform: rotate(360deg) scale(1); }
  }

  /* --- Aurora blobs --- */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    mix-blend-mode: screen;
    pointer-events: none;
    opacity: 0.8;
  }
  .blob-1 {
    width: 55vmax; height: 55vmax;
    background: radial-gradient(circle, #ff0080, transparent 70%);
    top: -15vmax; left: -15vmax;
    animation: float1 11s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 50vmax; height: 50vmax;
    background: radial-gradient(circle, #0070f3, transparent 70%);
    bottom: -15vmax; right: -10vmax;
    animation: float2 13s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 40vmax; height: 40vmax;
    background: radial-gradient(circle, #00ffa3, transparent 70%);
    top: 30%; left: 50%;
    animation: float3 9s ease-in-out infinite alternate;
  }
  .blob-4 {
    width: 35vmax; height: 35vmax;
    background: radial-gradient(circle, #7928ca, transparent 70%);
    top: 10%; right: 10%;
    animation: float1 15s ease-in-out infinite alternate-reverse;
  }
  @keyframes float1 {
    0% { transform: translate(0,0) scale(1) rotate(0deg); }
    100% { transform: translate(12vw, 10vh) scale(1.3) rotate(90deg); }
  }
  @keyframes float2 {
    0% { transform: translate(0,0) scale(1.1); }
    100% { transform: translate(-14vw, -12vh) scale(0.85); }
  }
  @keyframes float3 {
    0% { transform: translate(-50%,-50%) scale(1); }
    100% { transform: translate(-30%,-70%) scale(1.4); }
  }

  /* --- Grid + noise overlay --- */
  .grid-overlay {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    animation: gridPan 8s linear infinite;
    pointer-events: none;
  }
  @keyframes gridPan {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 60px 60px, 60px 60px; }
  }

  #particles {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
  }

  /* --- Cursor glow --- */
  #glow {
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.35), rgba(255,0,128,0.15), transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
    filter: blur(10px);
    z-index: 5;
  }

  /* --- Center content --- */
  .center {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
  }

  .hello {
    font-size: clamp(5rem, 20vw, 16rem);
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.9;
    background: linear-gradient(90deg, #fff, #ff0080, #ffea00, #00ffa3, #0070f3, #fff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textFlow 4s linear infinite, floatText 4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255,0,128,0.6)) drop-shadow(0 0 80px rgba(0,112,243,0.4));
    user-select: none;
    transition: transform 0.15s ease-out;
  }
  @keyframes textFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  @keyframes floatText {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -18px; }
  }

  .hello.glitch { animation: glitch 0.3s linear 3, textFlow 4s linear infinite; }
  @keyframes glitch {
    0% { transform: translate(0); text-shadow: -6px 0 #00ffa3, 6px 0 #ff0080; }
    25% { transform: translate(-8px, 4px) skewX(8deg); }
    50% { transform: translate(8px, -4px) skewX(-8deg); text-shadow: 6px 0 #00ffa3, -6px 0 #ff0080; }
    75% { transform: translate(-4px, -2px); }
    100% { transform: translate(0); }
  }

  .subtitle {
    margin-top: 1rem;
    color: rgba(255,255,255,0.85);
    font-size: clamp(0.9rem, 2.5vw, 1.25rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .hint {
    position: fixed;
    bottom: 28px;
    color: rgba(255,255,255,0.55);
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    z-index: 10;
    animation: pulse 2s infinite;
  }

  .controls {
    position: fixed;
    top: 20px;
    display: flex;
    gap: 10px;
    z-index: 20;
  }
  .controls button {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(12px);
    color: white;
    padding: 8px 18px;
    border-radius: 100px;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.25s;
    text-transform: uppercase;
  }
  .controls button:hover, .controls button.active {
    background: white;
    color: black;
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(255,255,255,0.5);
  }
</style>
</head>
<body>

<div class="bg-base"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="blob blob-4"></div>
<div class="grid-overlay"></div>
<canvas id="particles"></canvas>
<div id="glow"></div>

<div class="controls">
  <button class="active" data-mode="neon">Neon</button>
  <button data-mode="matrix">Matrix</button>
  <button data-mode="fire">Fire</button>
</div>

<div class="center">
  <h1 class="hello" id="hello">Hello</h1>
  <p class="subtitle">welcome to my universe</p>
</div>

<div class="hint">move mouse • click for explosion</div>

<script>
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const hello = document.getElementById('hello');
  const glow = document.getElementById('glow');
  let W, H, particles = [], mouse = { x: -999, y: -999 };
  let mode = 'neon';

  const themes = {
    neon: ['#ff0080', '#7928ca', '#0070f3', '#00ffa3', '#ffffff'],
    matrix: ['#00ff41', '#00cc33', '#ccffcc', '#008f11', '#ffffff'],
    fire: ['#ff4d00', '#ffea00', '#ff0080', '#ff9500', '#ffffff']
  };

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor(burstX, burstY) {
      if (burstX !== undefined) {
        this.x = burstX; this.y = burstY;
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 9 + 2;
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.008;
      } else {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.life = Math.random();
        this.decay = 0;
      }
      this.size = Math.random() * 3.5 + 0.8;
      this.color = themes[mode][Math.floor(Math.random() * themes[mode].length)];
      this.trail = [];
    }
    update() {
      // mouse repulsion + attraction swirl
      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 180 && dist > 1) {
        const force = (180 - dist) / 180 * 1.6;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
      this.vx *= 0.985; this.vy *= 0.985;
      this.x += this.vx; this.y += this.vy;
      this.life -= this.decay;

      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 8) this.trail.shift();

      // wrap around
      if (!this.decay) {
        if (this.x < 0) this.x = W; if (this.x > W) this.x = 0;
        if (this.y < 0) this.y = H; if (this.y > H) this.y = 0;
      }
    }
    draw() {
      // trail
      for (let i = 0; i < this.trail.length; i++) {
        const t = this.trail[i];
        const alpha = (i / this.trail.length) * 0.5 * (this.decay ? this.life : 1);
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.size * (i / this.trail.length), 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.fill();
      }
      ctx.globalAlpha = this.decay ? this.life : 0.9;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 18;
      ctx.shadowColor = this.color;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  // init ambient particles
  for (let i = 0; i < 160; i++) particles.push(new Particle());

  // connect nearby particles with lines
  function connect() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 120) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = a.color;
          ctx.globalAlpha = (1 - d / 120) * 0.25;
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  function loop() {
    ctx.fillStyle = 'rgba(5,5,16,0.28)';
    ctx.fillRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    connect();
    // remove dead burst particles, keep ambient count
    particles = particles.filter(p => p.life > 0 || !p.decay);
    while (particles.filter(p => !p.decay).length < 130) particles.push(new Particle());
    requestAnimationFrame(loop);
  }
  loop();

  // mouse glow + hello tilt
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
    const cx = (e.clientX / W - 0.5), cy = (e.clientY / H - 0.5);
    hello.style.transform = `rotateY(${cx * 30}deg) rotateX(${-cy * 30}deg) scale(${1 + Math.hypot(cx,cy)*0.15})`;
  });

  // click explosion
  window.addEventListener('click', e => {
    for (let i = 0; i < 60; i++) particles.push(new Particle(e.clientX, e.clientY));
    hello.classList.remove('glitch');
    void hello.offsetWidth;
    hello.classList.add('glitch');
  });

  // auto glitch every 4s
  setInterval(() => {
    hello.classList.remove('glitch');
    void hello.offsetWidth;
    hello.classList.add('glitch');
  }, 4000);

  // theme buttons
  document.querySelectorAll('.controls button').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      particles.forEach(p => p.color = themes[mode][Math.floor(Math.random() * themes[mode].length)]);
    });
  });
</script>
</body>
</html>
